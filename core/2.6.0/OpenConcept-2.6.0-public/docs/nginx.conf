# OpenConcept V2.3.0 Nginx virtual-host reference configuration
#
# IMPORTANT:
# - This is a reference `http`-context include, not a complete replacement for
#   the server's global nginx.conf.
# - OpenConcept does not install, enable, update, reload, or roll back the live
#   Nginx configuration automatically.
# - Installation, adaptation, validation, security review, operation, and
#   recovery are the server administrator's sole responsibility (自己責任).
# - Back up the live configuration and run `nginx -t` before every reload.
#
# Required changes before use:
# 1. Replace /absolute/path/to/openconcept with the V2.3.0 project root.
#    Keep the public Web root at $openconcept_root/public.
# 2. Replace openconcept.example.invalid with the real host name.
# 3. Replace php_upstream when the server does not define that upstream.
#    Examples include 127.0.0.1:9000 or a platform-specific PHP-FPM socket.
# 4. Add the environment-specific TLS, log, and reverse-proxy settings.
# 5. If OPENCONCEPT_DEPLOYMENT_WRITE_GATE_PATH is customized, change the
#    deployment marker check below to the identical absolute path.
# 6. Nginx does not normally inherit parent add_header directives into a child
#    context that declares its own add_header. Repeat required TLS headers such
#    as HSTS in the deployment-gate response and /published/ location after
#    validating the complete effective configuration with `nginx -T`.
#
# The default static-publication directory is <project>/published.  The
# location-level root below maps /published/... to that directory without
# exposing the rest of the project.

server {
    listen 80;
    server_name openconcept.example.invalid;

    set $openconcept_root "/absolute/path/to/openconcept";
    root $openconcept_root/public;

    index index.php index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    client_max_body_size 16m;

    # OpenConcept can wait for configured AI/RAG providers. Keep this above
    # the longest application-side provider timeout, then tune it to the
    # deployment's capacity and abuse controls.
    fastcgi_read_timeout 3600s;

    # Nginx never interprets .htaccess. Refuse all dot-paths, including
    # .user.ini and static-publication ownership/recovery markers.
    location ~ (^|/)\. {
        return 404;
    }

    # Defense in depth. These paths are outside the configured public root and
    # must remain unavailable even if matching files appear below public/.
    location ~* ^/(?:app|database|docker|docs|examples|locales|mcp|plugins|public|scripts|storage|tests|tmp)(?:/|$) {
        return 404;
    }

    # Static publications may contain only inert site files. Do not disclose
    # manifests, signatures, keys, or executable script formats.
    location ~* ^/published/.*\.(?:json|sig|key|php|phtml|phar|cgi|pl|py|sh)(?:/|$) {
        return 404;
    }

    # Keep both the canonical API URL and PATH_INFO variants behind the same
    # pre-PHP deployment write gate. PATH_INFO is otherwise unsupported.
    location ~* ^/api\.php(?:/|$) {
        open_file_cache off;

        if (-f $openconcept_root/storage/.deployment-write-gate) {
            # Repeat mandatory environment-specific TLS headers here because
            # these local add_header directives replace inherited ones.
            add_header Cache-Control "no-store" always;
            add_header Retry-After "60" always;
            return 503;
        }
        if ($uri != "/api.php") {
            return 404;
        }

        try_files /api.php =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $openconcept_root/public/api.php;
        fastcgi_param SCRIPT_NAME /api.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass php_upstream;
    }

    # Only the checked-in public entry points may execute as PHP.
    location ~ ^/(?:index|app-css|app-icon|app-js|export|history|plugin-asset|plugin-api-js|rag-css|rag-js|share-css|share)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $openconcept_root/public$fastcgi_script_name;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass php_upstream;
    }

    # Fail closed for every other PHP-looking URL, including PHP below a
    # generated publication directory.
    location ~* \.php(?:/|$) {
        return 404;
    }

    location = /published {
        return 308 /published/;
    }

    # URI /published/<slug>/ maps to <project>/published/<slug>/.
    # A conservative no-cache policy is applied to the complete generated site
    # so that an updated or withdrawn publication is not retained by clients.
    location /published/ {
        root $openconcept_root;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;

        limit_except GET {
            deny all;
        }

        # Repeat mandatory environment-specific TLS headers here because these
        # local add_header directives replace inherited ones.
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # OpenConcept uses file-based PHP endpoints rather than a front-controller
    # rewrite. A missing URL must remain a real 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
