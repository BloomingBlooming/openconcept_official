name: ${OPENCONCEPT_RAG_COMPOSE_PROJECT:-openconcept-v2-3-rag}

services:
  openconcept-web:
    platform: linux/amd64
    image: openconcept/rag-web:2.4.0
    build:
      context: .
      dockerfile: docker/openconcept/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCONCEPT_HTTP_PORT:-8080}:80"
    environment: &openconcept-environment
      OPENCONCEPT_CONTAINER: "1"
      OPENCONCEPT_DEPLOYMENT_PROFILE: rag-docker
      OPENCONCEPT_RAG_COMPOSE_PROJECT: ${OPENCONCEPT_RAG_COMPOSE_PROJECT:-openconcept-v2-3-rag}
      OPENCONCEPT_RUNTIME_UID: "33"
      OPENCONCEPT_RUNTIME_GID: "33"
      OPENCONCEPT_BGE_M3_BASE_URL: http://rag-embedding:8000/v1
      OPENCONCEPT_BGE_M3_API_KEY: ${OPENCONCEPT_BGE_M3_API_KEY:?OPENCONCEPT_BGE_M3_API_KEY is required}
      OPENCONCEPT_BGE_M3_MODEL: ${OPENCONCEPT_BGE_M3_MODEL:-BAAI/bge-m3}
      OPENCONCEPT_BGE_M3_REVISION: ${OPENCONCEPT_BGE_M3_REVISION:-}
      OPENCONCEPT_BGE_M3_DIMENSIONS: ${OPENCONCEPT_BGE_M3_DIMENSIONS:-1024}
      OPENCONCEPT_BGE_M3_ALLOW_PRIVATE_NETWORK: "1"
      OPENCONCEPT_BGE_M3_ALLOW_HTTP: "1"
      OPENCONCEPT_APP_URL: ${OPENCONCEPT_APP_URL:?OPENCONCEPT_APP_URL is required}
      OPENCONCEPT_DSN: ${OPENCONCEPT_DSN:-}
      OPENCONCEPT_DB_USER: ${OPENCONCEPT_DB_USER:-}
      OPENCONCEPT_DB_PASSWORD: ${OPENCONCEPT_DB_PASSWORD:-}
      OPENCONCEPT_TABLE_PREFIX: ${OPENCONCEPT_TABLE_PREFIX:-openconcept_}
    volumes:
      - openconcept_storage:/var/www/html/storage
      - openconcept_published:/var/www/html/published
    depends_on:
      postgres:
        condition: service_healthy
      rag-embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [openconcept-internal, openconcept-egress]

  openconcept-worker:
    platform: linux/amd64
    image: openconcept/rag-web:2.4.0
    restart: unless-stopped
    environment:
      <<: *openconcept-environment
      OPENCONCEPT_RAG_WORKER_INTERVAL: ${OPENCONCEPT_RAG_WORKER_INTERVAL:-15}
    command:
      - sh
      - -c
      - while true; do php scripts/run-rag-maintenance.php --limit=25 || true; sleep "$${OPENCONCEPT_RAG_WORKER_INTERVAL}"; done
    volumes:
      - openconcept_storage:/var/www/html/storage
      - openconcept_published:/var/www/html/published
    depends_on:
      openconcept-web:
        condition: service_healthy
    networks: [openconcept-internal, openconcept-egress]

  postgres:
    platform: linux/amd64
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:99a149d3c84cfb0f32d8da7d72737e4643468787220af2223418730f8e9e9cdc
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCONCEPT_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconcept}
      POSTGRES_USER: ${POSTGRES_USER:-openconcept}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [openconcept-internal, openconcept-host-access]

  rag-embedding:
    platform: linux/amd64
    image: openconcept/rag-embedding:1.0.0
    build:
      context: docker/rag-embedding
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCONCEPT_EMBEDDING_PORT:-8001}:8000"
    environment:
      OPENCONCEPT_BGE_M3_API_KEY: ${OPENCONCEPT_BGE_M3_API_KEY:?OPENCONCEPT_BGE_M3_API_KEY is required}
      OPENCONCEPT_BGE_M3_MODEL: ${OPENCONCEPT_BGE_M3_MODEL:-BAAI/bge-m3}
      OPENCONCEPT_BGE_M3_REVISION: ${OPENCONCEPT_BGE_M3_REVISION:-}
      OPENCONCEPT_BGE_M3_DEVICE: ${OPENCONCEPT_BGE_M3_DEVICE:-cpu}
      OPENCONCEPT_BGE_M3_BATCH_SIZE: ${OPENCONCEPT_BGE_M3_BATCH_SIZE:-16}
      HF_HOME: /models/huggingface
    volumes:
      - embedding_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert data.get('status') == 'ready'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 600s
    networks: [openconcept-internal, openconcept-egress]

  rag-stack-doctor:
    profiles: [tools]
    platform: linux/amd64
    image: openconcept/rag-web:2.4.0
    environment:
      <<: *openconcept-environment
      POSTGRES_DB: ${POSTGRES_DB:-openconcept}
      POSTGRES_USER: ${POSTGRES_USER:-openconcept}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint: ["php", "scripts/rag-stack-doctor.php"]
    volumes:
      - openconcept_storage:/var/www/html/storage
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [openconcept-internal]

networks:
  openconcept-internal:
    internal: true
  openconcept-host-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  openconcept-egress:

volumes:
  openconcept_storage:
  openconcept_published:
  postgres_data:
  embedding_cache:
